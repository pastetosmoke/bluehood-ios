name: Bluehood iOS Ad Hoc

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Import signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/bluehood-signing.keychain-db"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # これが無いと codesign が keychain アクセスの確認ダイアログを待ち、
          # CI が無言でタイムアウトするまでハングする(GUIが無いので誰も応答できない)。
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$RUNNER_TEMP" "$KEYCHAIN_PATH" >/dev/null

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_PATH="$RUNNER_TEMP/bluehood.mobileprovision"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/bluehood.mobileprovision"

      # .xcodeproj は生成物なのでコミットしない(pbxproj は差分が読めずコンフリクトを解決できない)。
      # project.yml を唯一の定義とし、ビルド直前に生成する。
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate --spec project.yml
          test -d Bluehood-iOS.xcodeproj

      - name: Build archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project Bluehood-iOS.xcodeproj \
            -scheme Bluehood \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Bluehood.xcarchive" \
            -destination "generic/platform=iOS" \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.PROVISIONING_PROFILE_NAME }}"

      - name: Export IPA
        env:
          EXPORT_OPTIONS_PLIST: ${{ secrets.EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          echo "$EXPORT_OPTIONS_PLIST" | base64 --decode > "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Bluehood.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          mkdir -p artifacts
          cp "$RUNNER_TEMP/export/"*.ipa artifacts/Bluehood.ipa
          shasum -a 256 artifacts/Bluehood.ipa > artifacts/Bluehood.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bluehood-iOS-AdHoc
          path: artifacts/
          retention-days: 30

      - name: Cleanup signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/bluehood-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12"
          rm -f "$RUNNER_TEMP/bluehood.mobileprovision"
          rm -f "$RUNNER_TEMP/ExportOptions.plist"
