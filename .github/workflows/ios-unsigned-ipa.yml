# 未署名IPAを生成する。AltStore / SideStore で自分のApple IDで署名して実機に入れる用。
#
# Apple Developer Program($99/年)が要らない経路。
# 署名はインストールする人が自分の無料Apple IDで行うので、
# このCIには証明書もProvisioning Profileも渡さない(Secretsゼロで動く)。
#
# 制約:
#   - 無料Apple IDの署名は7日で失効。AltServerが同一WiFi上にあれば自動更新される
#   - 無料Apple IDでサイドロードできるアプリは同時に3つまで
#   - 初回はiPhone側で「設定 → 一般 → VPNとデバイス管理」から開発者を信頼する必要がある
#
# シミュレータ向けではなく**デバイス向け(arm64)**でビルドすること。
# シミュレータ用バイナリは実機にインストールできない。

name: iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write        # タグ時にReleaseへIPAを添付するため

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Build unsigned (device arm64)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Bluehood-iOS.xcodeproj \
            -scheme Bluehood \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package as IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/Bluehood.app"
          test -d "$APP" || { echo "::error::.app が見つからない: $APP"; ls -R "$RUNNER_TEMP/dd/Build/Products" || true; exit 1; }

          # アーキテクチャを確認。x86_64だけならシミュレータ用で実機に入らない。
          echo "--- architectures ---"
          lipo -info "$APP/Bluehood" || true

          mkdir -p "$RUNNER_TEMP/pkg/Payload"
          cp -R "$APP" "$RUNNER_TEMP/pkg/Payload/"
          ( cd "$RUNNER_TEMP/pkg" && zip -qry "$GITHUB_WORKSPACE/Bluehood-unsigned.ipa" Payload )

          shasum -a 256 "$GITHUB_WORKSPACE/Bluehood-unsigned.ipa" \
            | tee "$GITHUB_WORKSPACE/Bluehood-unsigned.ipa.sha256"
          ls -lh "$GITHUB_WORKSPACE/Bluehood-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Bluehood-unsigned-ipa
          path: |
            Bluehood-unsigned.ipa
            Bluehood-unsigned.ipa.sha256
          retention-days: 14

      # タグ時のみ Release に添付する。アーティファクトと違い認証なしで落とせる。
      # prerelease にしているのは、実機で動作確認していないものを
      # 「リリース済み」と受け取られると困るため。
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            Bluehood-unsigned.ipa
            Bluehood-unsigned.ipa.sha256
          body: |
            ## 未署名IPA — 自分で署名して使うビルドです

            **このIPAはそのままではインストールできません。** 署名されていないので、
            AltStore / SideStore であなた自身の Apple ID による署名が必要です。
            そのぶん Apple Developer Program（$99/年）は不要で、Mac も要りません。

            ### 手順
            1. [AltStore](https://altstore.io/) の AltServer を PC に導入（Windows 可）
            2. iPhone に AltStore をインストール
            3. AltStore から `Bluehood-unsigned.ipa` をサイドロード
            4. iPhone: 設定 → 一般 → VPNとデバイス管理 → 開発者を信頼

            ### 制約
            - 無料 Apple ID の署名は **7日で失効**します（AltServer が同一 WiFi なら自動更新）
            - サイドロードできるアプリは**同時に3つまで**（AltStore 自身が1枠使用）
            - AltServer の Windows 版は Apple 公式サイト版の iTunes / iCloud が必要

            ### このビルドの状態
            **実機での動作確認は行っていません。** コンパイルとユニットテスト（32件）は
            CI で通過していますが、CoreBluetooth の実挙動は物理端末でしか検証できないため、
            未確認です。動作しない可能性があります。

            iOS 17 以降が必要です。AirTag は iOS の制約により検出できません
            （iOS 標準の追跡通知をご利用ください）。
